# Tests and build checks for pull requests. Reads the repository, publishes nothing, needs no secret.
# It does not run on push: start it by hand from the Actions tab, or let a pull request trigger it.
name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # Python 3.9, the oldest version the kit supports, is not built for Ubuntu 26.04, where ubuntu-latest is moving.
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m unittest discover tests
      - run: python3 build.py --check
